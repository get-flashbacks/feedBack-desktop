# Monthly checks; separate npm runtime and development update groups.
# Major and security updates stay outside the minor/patch groups.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch-production:
      dependency-type: production
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    minor-and-patch-development:
      dependency-type: development
      patterns:
      - '*'
      update-types:
      - minor
      - patch
